spring.application.name=car-rental

spring.datasource.url=jdbc:postgresql://localhost:5432/car_rental
spring.datasource.username=car_rental_user
spring.datasource.password=car_rental_user_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.admin.username=admin
app.admin.password=admin
app.jwt.secret=really_long_test_secret_key_for_testing_jwt
app.jwt.expiration=86400000

spring.jackson.property-naming-strategy=SNAKE_CASE