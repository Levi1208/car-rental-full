spring.application.name=car-rental

spring.datasource.url=jdbc:h2:mem:car_rental;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=car_rental_user
spring.datasource.password=car_rental_user_password
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.admin.username=admin
app.admin.password=admin
app.jwt.secret=really_long_test_secret_key_for_jwt_tokens_but_its_different
app.jwt.expiration=86400000

spring.jackson.property-naming-strategy=SNAKE_CASE